        // 渲染中心区域弃牌
        function renderCenterDiscarded() {
            if (!gameState || !gameState.playerInfo) return;

            let mySeatNum = 1;
            if (playerId && gameState.playerInfo[playerId]) {
                mySeatNum = gameState.playerInfo[playerId].seatNum;
            }

            // 屏幕位置映射：下=自己, 右=下家, 上=对家, 左=上家
            const zoneMap = {
                0: 'discardedBottom',  // 自己 -> 下方弃牌区
                1: 'discardedRight',   // 下家 -> 右侧弃牌区
                2: 'discardedTop',     // 对家 -> 上方弃牌区
                3: 'discardedLeft'     // 上家 -> 左侧弃牌区
            };

            // 先清空所有弃牌区
            Object.values(zoneMap).forEach(id => {
                const el = document.getElementById(id);
                if (el) el.innerHTML = '';
            });

            for (let seatNum = 1; seatNum <= 4; seatNum++) {
                const relativePos = (seatNum - mySeatNum + 4) % 4;
                const zoneId = zoneMap[relativePos];
                const zoneEl = document.getElementById(zoneId);
                if (!zoneEl) continue;

                // 找到该座位的玩家
                for (const [pid, info] of Object.entries(gameState.playerInfo)) {
                    if (info.seatNum !== seatNum) continue;

                    const cards = info.discardedCards || [];
                    cards.forEach(card => {
                        const div = document.createElement('div');
                        if (isRoundEnded) {
                            // 局结束时翻开弃牌，显示正面
                            div.className = 'discarded-card face-up';
                            const imgPath = getTileImagePath(card);
                            if (imgPath) {
                                const img = document.createElement('img');
                                img.src = imgPath;
                                div.appendChild(img);
                            }
                        } else {
                            div.className = 'discarded-card';
                        }
                        zoneEl.appendChild(div);
                    });
                    break;
                }
            }
        }

        // 更新方位标记
        function updateDirectionMarks(mySeatNum) {
            console.log('updateDirectionMarks 被调用, mySeatNum:', mySeatNum);

            // 座位对应的方位名：1=东(庄家), 2=南, 3=西, 4=北（逆时针：东→南→西→北）
            const seatToDirection = { 1: '东', 2: '南', 3: '西', 4: '北' };

            // 从玩家视角计算四个位置的方位
            // relativePos: 0=自己(下), 1=下家(右), 2=对家(上), 3=上家(左)
            const directions = ['south', 'east', 'north', 'west']; // 屏幕位置：下、右、上、左

            directions.forEach((pos, idx) => {
                // 计算该位置对应的座位号
                // 屏幕位置: idx=0(下/south), idx=1(右/east), idx=2(上/north), idx=3(左/west)
                // 坐东时(座位1): 下=东(1), 右=南(2), 上=西(3), 左=北(4)
                // 公式: 从自己座位开始，逆时针(座位号递增)对应 屏幕的下→右→上→左
                const seatNum = ((mySeatNum - 1 - idx + 4) % 4) + 1;
                const dirName = seatToDirection[seatNum];

                console.log(`方位更新: 屏幕位置=${pos}, idx=${idx}, 座位号=${seatNum}, 方位名=${dirName}`);

                const el = document.querySelector(`.direction.${pos}`);
                if (el) {
                    // 只更新方位名，保留庄家标记span
                    const textNode = el.firstChild;
                    if (textNode && textNode.nodeType === Node.TEXT_NODE) {
                        textNode.textContent = dirName;
                    } else {
                        // 如果没有文本节点，在开头插入
                        el.insertBefore(document.createTextNode(dirName), el.firstChild);
                    }
                    console.log(`已更新 .direction.${pos} 为 ${dirName}`);
                } else {
                    console.log(`未找到元素 .direction.${pos}`);
                }
            });

            // 更新庄家标记
            updateDealerMark();
        }

        // 更新庄家标记
        function updateDealerMark() {
            // 座位对应的方位名：1=东(庄家), 2=南, 3=西, 4=北（逆时针：东→南→西→北）
            const seatToDirection = { 1: '东', 2: '南', 3: '西', 4: '北' };

            // 清除所有庄家标记
            document.querySelectorAll('.dealer-mark').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });

            // 获取当前庄家的座位号
            if (gameState && gameState.dealerSeat) {
                const dealerSeat = gameState.dealerSeat;
                // 庄家方位名
                const dealerDirName = seatToDirection[dealerSeat] || '东';

                // 找到显示庄家方位的方向标记元素，添加庄家标记
                const directions = ['south', 'east', 'north', 'west'];
                directions.forEach(pos => {
                    const el = document.querySelector(`.direction.${pos}`);
                    if (el) {
                        const dirText = el.textContent.replace('庄', '').trim();
                        if (dirText === dealerDirName) {
                            const mark = document.getElementById(`dealer${pos.charAt(0).toUpperCase() + pos.slice(1)}`);
                            if (mark) {
                                mark.classList.add('show');
                                mark.textContent = '庄';
                            }
                        }
                    }
                });
                console.log(`庄家标记已更新: 庄家座位${dealerSeat}, 方位${dealerDirName}`);
            }
        }

        // 更新回合提示
        function updateTurnIndicator() {
            const turnIndicator = document.getElementById('turnIndicator');
            const handArea = document.getElementById('myHand');

            if (!gameState || !gameState.started) {
                turnIndicator.textContent = '等待开始...';
                turnIndicator.classList.remove('my-turn');
                handArea.classList.remove('my-turn');
                return;
            }

            // 一局结束时保留 handleRoundEnd 设置的胡牌/流局信息
            if (gameState.roundPhase === 'ended') {
                turnIndicator.classList.remove('my-turn');
                handArea.classList.remove('my-turn');
                return;
            }

            // 找到当前玩家的名字
            let currentPlayerName = '';
            for (const [pid, info] of Object.entries(gameState.playerInfo)) {
                if (info.seatNum === gameState.currentPlayerSeat) {
                    currentPlayerName = info.name;
                    break;
                }
            }

            const isMyTurn = gameState.currentPlayer === myIndex;

            if (isMyTurn) {
                turnIndicator.textContent = '🎯 轮到你出牌！';
                turnIndicator.classList.add('my-turn');
                handArea.classList.add('my-turn');
            } else {
                turnIndicator.textContent = `轮到 ${currentPlayerName} 出牌`;
                turnIndicator.classList.remove('my-turn');
                handArea.classList.remove('my-turn');
            }
        }

        // 获取牌对应的精灵图CSS类名
        function getTileSpriteClass(card) {
            if (card.type === 'number') {
                if (card.suit === '筒') {
                    return `tong${card.rank}`;
                } else if (card.suit === '条') {
                    return `tiao${card.rank}`;
                } else if (card.suit === '万') {
                    return `wan${card.rank}`;
                }
            } else if (card.type === 'wind') {
                const windMap = { '东': 'feng_dong', '南': 'feng_nan', '西': 'feng_xi', '北': 'feng_bei' };
                return windMap[card.rank] || '';
            } else if (card.type === 'arrow') {
                const arrowMap = { '中': 'jian_zhong', '发': 'jian_fa', '白': 'jian_bai' };
                return arrowMap[card.rank] || '';
            }
            return '';
        }

        // 获取牌对应的图片路径
        function getTileImagePath(card) {
            const baseName = getTileSpriteClass(card);
            if (baseName) {
                return `Images/${baseName}.png`;
            }
            return '';
        }

        // 获取牌的显示名称
        function getTileName(card) {
            if (!card) return '请选择一张牌';
            if (card.type === 'number') {
                return `${card.rank}${card.suit}`;
            } else if (card.type === 'wind') {
                return `${card.rank}风`;
            } else if (card.type === 'arrow') {
                const arrowNames = { '中': '红中', '发': '发财', '白': '白板' };
                return arrowNames[card.rank] || card.rank;
            }
            return '未知牌';
        }

        // 更新手牌提示区
        function updateHandHint(card) {
            const hintCard = document.getElementById('handHintCard');
            const hintText = document.getElementById('handHintText');
            const hintArea = document.getElementById('handHint');

            if (!card) {
                // 没有选中牌时隐藏提示区域
                hintArea.style.display = 'none';
                hintCard.innerHTML = '';
                return;
            }

            // 有选中牌时显示
            hintArea.style.display = 'flex';
            const imgPath = getTileImagePath(card);
            hintCard.innerHTML = `<img src="${imgPath}" alt="${getTileName(card)}" style="width:100%;height:100%;object-fit:contain;">`;
            hintCard.className = 'hand-hint-card';

            hintText.textContent = getTileName(card);
        }

        // 渲染自己的手牌
        function renderMyHand() {
            const container = document.getElementById('myHand');
            container.innerHTML = '';

            console.log('renderMyHand 被调用, gameState:', gameState ? '存在' : '不存在');
            console.log('myHand:', gameState?.myHand);

            if (!gameState || !gameState.myHand) {
                console.log('没有手牌数据，返回');
                return;
            }

            console.log('开始渲染手牌，数量:', gameState.myHand.length);

            gameState.myHand.forEach(card => {
                const div = document.createElement('div');
                div.className = 'tile-img';

                // 获取图片路径
                const imgPath = getTileImagePath(card);
                if (imgPath) {
                    const img = document.createElement('img');
                    img.src = imgPath;
                    img.alt = getTileName(card);
                    img.draggable = false;
                    div.appendChild(img);
                }

                // 判断是否是万能牌
                const isWild = isWildCard(card);
                if (isWild) {
                    div.classList.add('wild');
                }
                // 红中可替代万能牌，用弱标记
                if (!isWild && isWildCardHelper(card)) {
                    div.classList.add('wild-helper');
                }

                // 选中状态
                if (selectedCard && selectedCard.id === card.id) {
                    div.classList.add('selected');
                }

                div.onclick = () => selectCard(card);
                div.dataset.cardId = card.id;

                // 触摸拖拽功能
                div.addEventListener('touchstart', handleTouchStart, { passive: false });
                div.addEventListener('touchmove', handleTouchMove, { passive: false });
                div.addEventListener('touchend', handleTouchEnd);
                // 鼠标拖拽功能（PC端）
                div.draggable = true;
                div.addEventListener('dragstart', handleDragStart);
                div.addEventListener('dragend', handleDragEnd);
                div.addEventListener('dragover', handleDragOver);
                div.addEventListener('drop', handleDrop);
                div.addEventListener('dragleave', handleDragLeave);

                container.appendChild(div);
            });
        }

        // 创建筒子圆点
        function createDots(count) {
            let dots = '';
            for (let i = 0; i < count; i++) {
                dots += '<div class="dot"></div>';
            }
            return dots;
        }

        // 创建条子竹节
        function createBamboo(count) {

            if (count === 1) {
                bamboo = '<div class="bamboo-stick"></div>';
            } else if (count === 2) {
                bamboo = '<div class="bamboo-row"><div class="bamboo-stick"></div></div><div class="bamboo-row"><div class="bamboo-stick"></div></div>';
            } else if (count === 3) {
                bamboo = '<div class="bamboo-row"><div class="bamboo-stick"></div></div><div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div>';
            } else if (count === 4) {
                bamboo = '<div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div><div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div>';
            } else if (count === 5) {
                bamboo = '<div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div><div class="bamboo-row"><div class="bamboo-stick"></div></div><div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div>';
            } else if (count === 6) {
                bamboo = '<div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div><div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div><div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div>';
            } else if (count === 7) {
                bamboo = '<div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div><div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div><div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div>';
            } else if (count === 8) {
                bamboo = '<div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div><div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div><div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div>';
            } else if (count === 9) {
                bamboo = '<div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div><div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div><div class="bamboo-row"><div class="bamboo-stick"></div><div class="bamboo-stick"></div><div class="bamboo-stick"></div></div>';
            }
            return bamboo;
        }

        // 拖拽相关变量
        let draggedCardId = null;

        // ===== 触摸拖拽 =====
        let touchDragId = null;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchMoved = false;
        const TOUCH_DRAG_THRESHOLD = 15; // 拖拽触发阈值（像素）

        // 拖拽出牌：判断坐标是否在中间弃牌区域内
        function isInCenterDiscarded(clientX, clientY) {
            const el = document.getElementById('centerDiscarded');
            if (!el) return false;
            const rect = el.getBoundingClientRect();
            return clientX >= rect.left && clientX <= rect.right &&
                   clientY >= rect.top && clientY <= rect.bottom;
        }

        // 拖拽出牌：执行出牌
        function playCardByDrag(cardId) {
            const isMyTurn = gameState && gameState.currentPlayer === myIndex;
            if (!isMyTurn) return;
            const card = gameState.myHand.find(c => c.id === cardId);
            if (!card) return;
            ws.send(JSON.stringify({
                type: 'play',
                cardId: cardId
            }));
            selectedCard = null;
        }

        function handleTouchStart(e) {
            const tile = e.target.closest('.tile-img');
            if (!tile) return;
            touchDragId = tile.dataset.cardId;
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchMoved = false;
        }

        function handleTouchMove(e) {
            if (!touchDragId) return;
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;

            if (!touchMoved && Math.abs(dx) < TOUCH_DRAG_THRESHOLD && Math.abs(dy) < TOUCH_DRAG_THRESHOLD) {
                return; // 还没达到拖拽阈值
            }
            touchMoved = true;
            e.preventDefault(); // 阻止页面滚动

            // 中间弃牌区域高亮
            const centerEl = document.getElementById('centerDiscarded');
            if (centerEl) {
                if (isInCenterDiscarded(touch.clientX, touch.clientY)) {
                    centerEl.classList.add('drag-play-active');
                } else {
                    centerEl.classList.remove('drag-play-active');
                }
            }

            // 找到当前触摸位置下方的牌
            const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            const targetTile = elemBelow ? elemBelow.closest('.tile-img') : null;

            // 清除所有拖拽指示
            document.querySelectorAll('.tile-img').forEach(t => {
                t.classList.remove('touch-dragging', 'touch-drag-over', 'touch-drag-over-left');
            });

            // 标记拖拽的牌
            const dragTile = document.querySelector(`.tile-img[data-card-id="${touchDragId}"]`);
            if (dragTile) dragTile.classList.add('touch-dragging');

            // 标记目标位置（仅在非中间区域时排序）
            if (targetTile && targetTile.dataset.cardId !== touchDragId && !isInCenterDiscarded(touch.clientX, touch.clientY)) {
                const container = document.getElementById('myHand');
                const tiles = Array.from(container.children);
                const dragIdx = tiles.findIndex(t => t.dataset.cardId === touchDragId);
                const targetIdx = tiles.findIndex(t => t.dataset.cardId === targetTile.dataset.cardId);
                if (dragIdx !== -1 && targetIdx !== -1) {
                    if (targetIdx > dragIdx) {
                        targetTile.classList.add('touch-drag-over');
                    } else {
                        targetTile.classList.add('touch-drag-over-left');
                    }
                }
            }
        }

        function handleTouchEnd(e) {
            if (!touchDragId) return;

            // 清除所有视觉指示
            document.querySelectorAll('.tile-img').forEach(t => {
                t.classList.remove('touch-dragging', 'touch-drag-over', 'touch-drag-over-left');
            });
            const centerEl = document.getElementById('centerDiscarded');
            if (centerEl) centerEl.classList.remove('drag-play-active');

            if (touchMoved) {
                // 拖拽结束 - 检查是否拖到中间区域（出牌）
                const touch = e.changedTouches[0];
                if (isInCenterDiscarded(touch.clientX, touch.clientY)) {
                    playCardByDrag(touchDragId);
                    touchDragId = null;
                    touchMoved = false;
                    return;
                }

                // 否则查找目标牌（排序）
                const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                const targetTile = elemBelow ? elemBelow.closest('.tile-img') : null;

                if (targetTile && targetTile.dataset.cardId !== touchDragId) {
                    const fromIndex = gameState.myHand.findIndex(c => c.id === touchDragId);
                    const toIndex = gameState.myHand.findIndex(c => c.id === targetTile.dataset.cardId);
                    if (fromIndex !== -1 && toIndex !== -1 && fromIndex !== toIndex) {
                        const [movedCard] = gameState.myHand.splice(fromIndex, 1);
                        gameState.myHand.splice(toIndex, 0, movedCard);
                        saveHandOrder();
                        renderMyHand();
                    }
                }
            }
            // 如果没有移动，让 onclick 正常触发（选牌）
            touchDragId = null;
            touchMoved = false;
        }

        // ===== PC端鼠标拖拽 =====
        function handleDragStart(e) {
            draggedCardId = e.target.dataset.cardId;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.tile-img').forEach(card => {
                card.classList.remove('drag-over');
            });
            const centerEl = document.getElementById('centerDiscarded');
            if (centerEl) centerEl.classList.remove('drag-play-active');
            draggedCardId = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';

            // 中间弃牌区域高亮
            const centerEl = document.getElementById('centerDiscarded');
            if (centerEl && centerEl.contains(e.target)) {
                centerEl.classList.add('drag-play-active');
                return;
            }
            if (centerEl) centerEl.classList.remove('drag-play-active');

            const target = e.target.closest('.tile-img');
            if (target && target.dataset.cardId !== draggedCardId) {
                target.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            const target = e.target.closest('.tile-img');
            if (target) {
                target.classList.remove('drag-over');
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            const centerEl = document.getElementById('centerDiscarded');

            // 拖到中间区域 → 出牌
            if (centerEl && centerEl.contains(e.target) && draggedCardId) {
                centerEl.classList.remove('drag-play-active');
                playCardByDrag(draggedCardId);
                draggedCardId = null;
                return;
            }

            // 拖到其他牌上 → 排序
            const target = e.target.closest('.tile-img');
            if (!target || !draggedCardId) return;

            const targetCardId = target.dataset.cardId;
            if (targetCardId === draggedCardId) return;

            // 重新排序手牌
            const fromIndex = gameState.myHand.findIndex(c => c.id === draggedCardId);
            const toIndex = gameState.myHand.findIndex(c => c.id === targetCardId);

            if (fromIndex !== -1 && toIndex !== -1) {
                const [movedCard] = gameState.myHand.splice(fromIndex, 1);
                gameState.myHand.splice(toIndex, 0, movedCard);
                saveHandOrder(); // 保存用户手动排序
                renderMyHand();
            }

            target.classList.remove('drag-over');
        }

        // 判断是否是万能牌（癞子本身，用于高亮显示）
        function isWildCard(card) {
            if (!gameState || !gameState.wildCard) {
                return false;
            }
            const wild = gameState.wildCard;

            // 只高亮癞子本身（与翻出的牌相同的牌）
            const sameCard = (card.suit === wild.suit &&
                             String(card.rank) === String(wild.rank) &&
                             card.type === wild.type);

            return sameCard;
        }

        // 判断是否是万能牌辅助牌（红中，可替代万能牌但不高亮）
        function isWildCardHelper(card) {
            return card.type === 'arrow' && card.rank === '中';
        }

        // ==================== 手牌排序保持 ====================
        // 记录用户手动排过的card id顺序
        let localHandOrder = []; // card id 数组，用户拖拽排序后的顺序

        // 合并服务端手牌到本地排序：已知牌保持本地顺序，新牌追加到末尾
        function mergeHandOrder(serverHand, prevHand) {
            if (!serverHand || serverHand.length === 0) {
                localHandOrder = [];
                return serverHand;
            }

            const serverIds = new Set(serverHand.map(c => c.id));
            const oldIds = new Set((prevHand || []).map(c => c.id));

            // 找新牌（服务端有但上一轮没有的）
            const newCardIds = [];
            for (const id of serverIds) {
                if (!oldIds.has(id)) {
                    newCardIds.push(id);
                }
            }

            // 如果本地排序为空或是全新一局（牌数差异大，>4表示换发/杠牌以外的大变化），重置本地排序
            if (localHandOrder.length === 0 || !prevHand || prevHand.length === 0 || Math.abs(serverHand.length - prevHand.length) > 4) {
                localHandOrder = serverHand.map(c => c.id);
                return serverHand;
            }

            // 构建card id到card对象的映射
            const cardMap = {};
            for (const card of serverHand) {
                cardMap[card.id] = card;
            }

            // 按本地顺序排列已知牌，新牌追加到末尾
            const result = [];
            const placed = new Set();
            for (const id of localHandOrder) {
                if (serverIds.has(id)) {
                    result.push(cardMap[id]);
                    placed.add(id);
                }
            }
            // 追加新牌
            for (const id of newCardIds) {
                if (!placed.has(id)) {
                    result.push(cardMap[id]);
                    placed.add(id);
                }
            }

            // 安全检查：如果结果数量不对，回退到服务端原始顺序
            if (result.length !== serverHand.length) {
                localHandOrder = serverHand.map(c => c.id);
                return serverHand;
            }

            // 更新本地排序
            localHandOrder = result.map(c => c.id);
            return result;
        }

        // 保存用户拖拽后的排序
        function saveHandOrder() {
            if (gameState && gameState.myHand) {
                localHandOrder = gameState.myHand.map(c => c.id);
            }
        }

        // 获取牌的短名称
        function getCardShortName(card) {
            if (card.type === 'number') {
                return card.rank;
            } else {
                return card.rank;
            }
        }

        // 获取牌的显示名称
        function getCardDisplayName(card) {
            if (card.type === 'number') {
                return `${card.rank}${card.suit}`;
            } else if (card.type === 'wind') {
                return card.rank;
            } else {
                return card.rank;
            }
        }

        // 选择牌
        function selectCard(card) {
            if (selectedCard && selectedCard.id === card.id) {
                selectedCard = null;
            } else {
                selectedCard = card;
            }

        // 掷骰子

        function rollDice() {
            const dice1 = document.getElementById('dice1');
            const dice2 = document.getElementById('dice2');
            const btn = document.getElementById('rollDiceBtn');

            // 检查是否轮到自己掷骰子

            dice1.classList.add('rolling');
            dice2.classList.add('rolling');

            let count = 0;
            const interval = setInterval(() => {
                dice1.textContent = Math.floor(Math.random() * 6) + 1;
                dice2.textContent = Math.floor(Math.random() * 6) + 1;
                count++;

                if (count >= 10) {
                    clearInterval(interval);
                    dice1.classList.remove('rolling');
                    dice2.classList.remove('rolling');
                    diceRolling = false;

                    // 发送掷骰子请求给服务器（不传值，由服务器生成）
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'diceRoll' }));

                        // 连接断开，恢复按钮
                        btn.disabled = false;

                }
            }, 100);

        // 获取牌的显示名称
        function getCardDisplayName(card) {
            if (!card) return '';
            if (card.type === 'number') {
                return `${card.rank}${card.suit}`;
            } else {
                return card.rank;
            }
        }

        // 根据玩家ID获取玩家名称
        function getPlayerNameById(pid) {
            if (gameState && gameState.playerInfo) {
                const info = gameState.playerInfo[pid];
                if (info) return info.name;
            }
            return '玩家';
        }

        // ==================== 牌墙渲染 ====================
        // 牌墙状态：每方位17墩，每墩2张
        let wallState = {
            1: 17, // 东（1号位）
            2: 17, // 南（2号位）- 实际是右侧
            3: 17, // 西（3号位）- 上方
            4: 17  // 北（4号位）- 左侧
        };

        // 保存亮牌信息
        let currentShownCard = null;
        let currentShownInfo = null;

        // 渲染牌墙
        function renderWall(shownInfo = null) {
            const directions = ['North', 'South', 'West', 'East'];

            // 使用全局 mySeatNum（已在玩家加入座位时设置）
            // 注意：不要在函数内部重新声明 let mySeatNum
            console.log('renderWall - 使用全局座位号:', mySeatNum);

            // 根据玩家视角计算各方位对应的座位号
            // 座位：1=东(庄家), 2=南, 3=西, 4=北（逆时针：东→南→西→北）
            // 坐东时(座位1): 下=东(1), 右=南(2), 上=西(3), 左=北(4)
            const seatMap = {
                'South': mySeatNum,                          // 下 = 自己
                'East': (mySeatNum % 4) + 1,                 // 右 = 逆时针下一个
                'North': ((mySeatNum + 1) % 4) + 1,          // 上 = 对家
                'West': ((mySeatNum + 2) % 4) + 1            // 左 = 逆时针上两个
            };

            console.log(`牌墙渲染 - 我的座位: ${mySeatNum}, seatMap:`, seatMap, 'wallState:', wallState);

            directions.forEach(dir => {
                const wallEl = document.getElementById('wall' + dir);
                if (!wallEl) return;

                const seatNum = seatMap[dir];
                // 注意：wallState的键可能是字符串或数字，用两种方式尝试
                // 新格式：wallState[seatNum] = { start: 起始序号, count: 保留数量 }
                const state = wallState[seatNum] !== undefined ? wallState[seatNum] :
                              (wallState[String(seatNum)] !== undefined ? wallState[String(seatNum)] : { start: 1, count: 17 });

                // 兼容旧格式（纯数字）
                const keepStart = state.start !== undefined ? state.start : 1;
                const keepCount = state.count !== undefined ? state.count : (typeof state === 'number' ? state : 17);

                console.log(`牌墙 ${dir} -> 座位${seatNum} -> 保留序号${keepStart}开始的${keepCount}墩`);

                wallEl.innerHTML = '';

                // 牌墙视觉布局（每个人看自己的牌墙都是左1右17）：
                // 从我的视角看：
                // - 南（下）：左1→右17
                // - 北（上）：左17→右1
                // - 西（左）：上1→下17
                // - 东（右）：上17→下1
                // 抓牌方向都是序号1→17

                for (let i = 0; i < 17; i++) {
                    const pile = document.createElement('div');
                    pile.className = 'wall-pile';

                    // 计算牌墩编号（1-17），根据视觉位置确定
                    let pileNum;
                    if (dir === 'South') {
                        pileNum = i + 1;   // 左边是1，右边是17
                    } else if (dir === 'North') {
                        pileNum = 17 - i;  // 左边是17，右边是1
                    } else if (dir === 'West') {
                        pileNum = i + 1;   // 上边是1，下边是17
                    } else { // East
                        pileNum = 17 - i;  // 上边是17，下边是1
                    }

                    // 判断这个牌墩是否应该显示
                    // keepCount = 0 表示全部被抓
                    let showTile = false;
                    if (keepCount > 0) {
                        // 保留的是从 keepStart 开始的 keepCount 个牌墩（按序号方向）
                        showTile = pileNum >= keepStart && pileNum < keepStart + keepCount;
                    }
                    // 检查 endKeep（牌墙中间被取走后，末尾还保留的部分）
                    if (!showTile && state.endKeep) {
                        const ek = state.endKeep;
                        showTile = pileNum >= ek.start && pileNum < ek.start + ek.count;
                    }
                    // 检查是否是半墩（上面一张被抓走，只剩下面一张）
                    const halfPilesList = state.halfPiles || [];
                    const isHalfPile = halfPilesList.includes(pileNum);
                    // 亮牌位置：仅当亮牌还在牌墙上（未移到中央）时显示
                    const isShownPile = shownInfo && !shownInfo.movedToCenter && shownInfo.direction === seatNum && shownInfo.pile === pileNum;

                    if (showTile || isShownPile) {
                        // 每墩只显示一张牌背面
                        const tile1 = document.createElement('div');
                        tile1.className = 'wall-tile top-tile';
                        // 半墩：只剩1张牌，显示为半高
                        if (isHalfPile) {
                            tile1.classList.add('half-pile');
                        }

                        // 添加牌墩序号标签（调试用）
                        const label = document.createElement('span');
                        label.className = 'pile-label';
                        label.textContent = pileNum;
                        label.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:10px;color:#666;z-index:10;background:rgba(255,255,255,0.7);border-radius:3px;padding:1px 3px;';
                        tile1.appendChild(label);

                        // 检查是否是亮牌位置
                        if (shownInfo && shownInfo.direction === seatNum && shownInfo.pile === pileNum) {
                            tile1.classList.add('shown');
                            // 在亮牌位置显示麻将牌图片
                            if (currentShownCard) {
                                const imgSrc = getCardImageSrc(currentShownCard);
                                if (imgSrc) {
                                    // 创建图片元素显示在牌墙上
                                    const img = document.createElement('img');
                                    img.src = imgSrc;

                                    // 根据方位调整图片旋转
                                    let rotation = 0;
                                    if (dir === 'North') {
                                        rotation = 0;
                                    } else if (dir === 'South') {
                                        rotation = 180;
                                    } else if (dir === 'West') {
                                        rotation = -90;
                                    } else if (dir === 'East') {
                                        rotation = 90;
                                    }

                                    img.style.cssText = `width:80%;height:80%;object-fit:contain;border-radius:2px;transform:rotate(${rotation}deg);position:absolute;top:10%;left:10%;`;
                                    tile1.innerHTML = '';
                                    tile1.appendChild(img);
                                }
                            }
                        }

                        pile.appendChild(tile1);
                    } else {
                        // 已被抓走的牌墩 - 显示为空白，并显示序号
                        const tile1 = document.createElement('div');
                        tile1.className = 'wall-tile top-tile empty';

                        // 空牌墩也显示序号（调试用）
                        const label = document.createElement('span');
                        label.className = 'pile-label';
                        label.textContent = pileNum;
                        label.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:10px;color:#999;z-index:10;';
                        tile1.appendChild(label);

                        pile.appendChild(tile1);
                    }

                    wallEl.appendChild(pile);
                }
            });
        }

        // 获取麻将牌图片路径
        function getCardImageSrc(card) {
            if (!card) return null;

            if (card.type === 'number') {
                const suitPinyin = { '筒': 'tong', '条': 'tiao', '万': 'wan' };
                return `Images/${suitPinyin[card.suit]}${card.rank}.png`;
            } else if (card.type === 'wind') {
                const windPinyin = { '东': 'dong', '南': 'nan', '西': 'xi', '北': 'bei' };
                return `Images/feng_${windPinyin[card.rank]}.png`;
            } else if (card.type === 'arrow') {
                const arrowPinyin = { '中': 'zhong', '发': 'fa', '白': 'bai' };
                return `Images/jian_${arrowPinyin[card.rank]}.png`;
            }
            return null;
        }

        // 更新牌墙（抓牌后减少）
        function updateWall(direction, count) {
            wallState[direction] = Math.max(0, (wallState[direction] || 17) - count);
            renderWall(currentShownInfo);
        }

        // 重置牌墙
        function resetWall() {
            wallState = { 1: 17, 2: 17, 3: 17, 4: 17 };
            renderWall(currentShownInfo);
        }

        // 显示万能牌
        function showShownCard(shownCard, wildCard, drawInfo) {
            const wildCardInfo = document.getElementById('wildCardInfo');
            const wildCardDisplay = document.getElementById('wildCardDisplay');
            const shownCardDisplay = document.getElementById('shownCardDisplay');
            const shownCardImg = document.getElementById('shownCardImg');

            // 保存亮牌信息用于渲染（标准化属性名，供 renderWall 使用）
            currentShownCard = shownCard;
            currentShownInfo = {
                direction: drawInfo.shownDirection,
                pile: drawInfo.shownPile
            };

            // 显示万能牌（癞子）
            if (wildCard) {
                wildCardInfo.style.display = 'block';
                const imgSrc = getCardImageSrc(wildCard);
                if (imgSrc) {
                    wildCardDisplay.innerHTML = `<img src="${imgSrc}" style="width:28px;height:36px;vertical-align:middle;" alt="${getCardDisplayName(wildCard)}">`;
                } else {
                    wildCardDisplay.textContent = getCardDisplayName(wildCard);
                }
            }

            // 亮牌最初不在中央显示，只在牌墙上标记
            // 等到抓牌跳过亮牌后才移到中央显示
            shownCardDisplay.style.display = 'none';

            // 在牌墙上标记亮牌位置并显示图片
            if (drawInfo && drawInfo.shownDirection) {
                renderWall({
                    direction: drawInfo.shownDirection,
                    pile: drawInfo.shownPile
                });
            }
        }

        // 更新计分板
        function updateScoreboard(players) {
            const scoreboardList = document.getElementById('scoreboardList');
            if (!scoreboardList) return;
            scoreboardList.innerHTML = '';
            // 按座位号排序
            const sorted = [...players].sort((a, b) => a.seatNum - b.seatNum);
            for (const player of sorted) {
                const div = document.createElement('div');
                div.className = 'score-item';
                const score = player.totalScore || 0;
                const cls = score > 0 ? 'positive' : score < 0 ? 'negative' : 'zero';
                div.innerHTML = `<span class="score-name">${player.name}</span><span class="score-value ${cls}">${score > 0 ? '+' : ''}${score}</span>`;
                scoreboardList.appendChild(div);
            }
        }

            if (detail.winnerShowed) {

                        const imgPath = getTileImagePath(card);
                        html += '<div class="hu-tile">';
                        if (imgPath) html += '<img src="' + imgPath + '" alt="發">';
                        html += '</div>';
                    });
                    html += '</div></div>';
                }
                if (gangCards.length > 0) {
                    html += '<div class="hu-section">';
                    html += '<div class="hu-section-title">暗杠 (' + gangCards.length + '组)</div>';
                    html += '<div class="hu-tiles">';
                    gangCards.forEach(group => {
                        (group || []).forEach(card => {
                            const imgPath = getTileImagePath(card);
                            html += '<div class="hu-tile">';
                            if (imgPath) html += '<img src="' + imgPath + '" alt="杠">';
                            html += '</div>';
                        });
                        html += '<div style="width:8px;"></div>';
                    });
                    html += '</div></div>';
                }
            }

            // 计分明细
            html += '<div class="hu-section">';
            html += '<div class="hu-section-title">计分</div>';
            const faCount = (detail.winnerShowed?.fa || []).length;
            const gangCount = (detail.winnerShowed?.gang || []).length;
            html += '<div class="hu-score-line"><span class="label">基础分</span><span class="value">1</span></div>';
            if (faCount > 0) html += '<div class="hu-score-line"><span class="label">换發 ×' + faCount + '</span><span class="value">+' + faCount + '</span></div>';
            if (gangCount > 0) html += '<div class="hu-score-line"><span class="label">暗杠 ×' + gangCount + '</span><span class="value">+' + (gangCount * 2) + '</span></div>';
            html += '<div class="hu-score-line"><span class="label">单倍得分</span><span class="value">' + detail.baseScore + '</span></div>';
            html += '<div class="hu-score-line" style="border-top:1px solid rgba(255,215,0,0.3);padding-top:4px;margin-top:4px;"><span class="label">总分 (×3人)</span><span class="value" style="font-size:16px;">' + detail.totalScore + '</span></div>';
            html += '</div>';

            // 关闭按钮
            html += '<button class="hu-close" onclick="closeHuDetail()">关闭</button>';

            overlay.innerHTML = html;
            overlay.style.display = 'block';
        }

        function closeHuDetail() {
            const overlay = document.getElementById('huDetailOverlay');
            if (overlay) overlay.style.display = 'none';
        }

        // 获取玩家名称
        function getPlayerName(playerId) {
            if (gameState && gameState.playerInfo && gameState.playerInfo[playerId]) {
                return gameState.playerInfo[playerId].name || '玩家';
            }
            return '玩家';
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 从 localStorage 读取保存的用户名
            const savedName = localStorage.getItem('majiangPlayerName');
            if (savedName) {
                document.getElementById('playerName').value = savedName;
            }

            // 中间弃牌区域：允许拖入出牌
            const centerEl = document.getElementById('centerDiscarded');
            if (centerEl) {
                centerEl.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                });
                centerEl.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (draggedCardId) {
                        centerEl.classList.remove('drag-play-active');
                        playCardByDrag(draggedCardId);
                        draggedCardId = null;
                    }
                });
            }

            connect();
        });
    </script>
</body>
</html>
